<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilo</title>
<script>
(function () {
  var lingue = ["it", "en", "es", "fr", "de", "pt"];
  var l = location.hash.slice(1, 3);
  if (lingue.indexOf(l) < 0) {
    l = "en";
    var preferite = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < preferite.length; i++) {
      var p = String(preferite[i]).slice(0, 2).toLowerCase();
      if (lingue.indexOf(p) >= 0) { l = p; break; }
    }
  }
  location.replace(l + "/");
})();
</script>
<link rel="stylesheet" href="stile.css">
</head>
<body>
<main>
<p class="lingue"><a href="it/" lang="it">Italiano</a> · <a href="en/" lang="en">English</a> · <a href="es/" lang="es">Español</a> · <a href="fr/" lang="fr">Français</a> · <a href="de/" lang="de">Deutsch</a> · <a href="pt/" lang="pt">Português</a></p>
</main>
</body>
</html>
