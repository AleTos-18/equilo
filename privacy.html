<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equilo</title>
<script>
(function () {
  var lingue = ["it", "en", "es", "fr", "de", "pt", "nl", "pl"];
  var l = location.hash.slice(1, 3);
  if (lingue.indexOf(l) < 0) {
    l = "en";
    var preferite = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < preferite.length; i++) {
      var p = String(preferite[i]).slice(0, 2).toLowerCase();
      if (lingue.indexOf(p) >= 0) { l = p; break; }
    }
  }
  location.replace(l + "/privacy.html");
})();
</script>
<link rel="stylesheet" href="stile.css">
</head>
<body>
<main>
<p class="lingue"><a href="it/privacy.html" lang="it">Italiano</a> · <a href="en/privacy.html" lang="en">English</a> · <a href="es/privacy.html" lang="es">Español</a> · <a href="fr/privacy.html" lang="fr">Français</a> · <a href="de/privacy.html" lang="de">Deutsch</a> · <a href="pt/privacy.html" lang="pt">Português</a> · <a href="nl/privacy.html" lang="nl">Nederlands</a> · <a href="pl/privacy.html" lang="pl">Polski</a></p>
</main>
</body>
</html>
